<!DOCTYPE html>
<html>
<head>
    <title>Update Product</title>
    <script>
        async function updateProduct(event) {
            event.preventDefault();
            const product = {
                id: parseInt(document.getElementById('id').value),
                name: document.getElementById('name').value,
                price: parseFloat(document.getElementById('price').value),
                size: document.getElementById('size').value,
                color: document.getElementById('color').value
            };
            try {
                const response = await fetch('/products/update', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(product)
                });
                if (response.ok) {
                    alert('Product updated successfully!');
                } else {
                    alert('Update failed: ' + await response.text());
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
    </script>
</head>
<body>
<h1>Update Product</h1>
<form onsubmit="updateProduct(event)">
    <label>ID</label><br>
    <input type="number" id="id" required><br>
    <label>Name</label><br>
    <input type="text" id="name" required><br>
    <label>Price</label><br>
    <input type="number" step="0.01" id="price" required><br>
    <label>Size</label><br>
    <input type="text" id="size" required><br>
    <label>Color</label><br>
    <input type="text" id="color" required><br><br>
    <button type="submit">Update Product</button>
</form>
</body>
</html>
