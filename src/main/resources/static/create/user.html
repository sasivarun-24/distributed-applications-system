<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Create User</title>
    <style>
        body
        {
            font-family: Arial, sans-serif; padding: 2rem; background-color: #f9f9f9;
        }
        label {
            display: block; margin-top: 10px;
        }
        input[type="text"], input[type="email"], input[type="number"] {
            padding: 8px; width: 300px; margin-top: 4px;
        }
        button {
            margin-top: 20px; padding: 10px 20px; background-color: #007acc; color: white; border: none; border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #005da0; }
    </style>
</head>
<body>
<h1>Create New User</h1>
<form action="/user/create" method="POST">
    <label for="id">ID (number)</label>
    <input type="number" id="id" name="id" required />

    <label for="firstName">First Name</label>
    <input type="text" id="firstName" name="firstName" required />

    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" name="lastName" required />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required />

    <button type="submit">Create User</button>
</form>
</body>
</html>
