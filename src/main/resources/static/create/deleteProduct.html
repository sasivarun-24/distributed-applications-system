<!DOCTYPE html>
<html>
<head>
    <title>Delete Product</title>
    <script>
        async function deleteProduct(event) {
            event.preventDefault();
            const id = document.getElementById('id').value;
            try {
                const response = await fetch('/products/delete/' + id, { method: 'DELETE' });
                if (response.ok) {
                    alert('Product deleted successfully!');
                } else if (response.status === 404) {
                    alert('Product not found!');
                } else {
                    alert('Delete failed: ' + await response.text());
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
    </script>
</head>
<body>
<h1>Delete Product</h1>
<form onsubmit="deleteProduct(event)">
    <label>Product ID to delete</label><br>
    <input type="number" id="id" required><br><br>
    <button type="submit">Delete Product</button>
</form>
</body>
</html>
