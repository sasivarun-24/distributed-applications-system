<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Detail</title>
</head>
<body>
<h1 th:text="${productDetailDTO.product.name}">Product Name</h1>
<ul>
    <li>ID: <span th:text="${productDetailDTO.product.id}"></span></li>
    <li>Price: <span th:text="${productDetailDTO.product.price}"></span></li>
    <li>Size: <span th:text="${productDetailDTO.product.size}"></span></li>
    <li>Color: <span th:text="${productDetailDTO.product.color}"></span></li>
    <li>Stock: <span th:text="${productDetailDTO.stock}"></span></li>
</ul>

<p th:if="${productDetailDTO.isSoldOut}" style="color: red;">Sold Out!</p>

<a th:if="!${productDetailDTO.isSoldOut}"
   th:href="@{'/cart-add/' + ${productDetailDTO.product.id}}">Add to Cart</a>
<br/><br/>

<a href="/mvc-api/product">Back to Catalog</a>
<a href="/dashboard/dashboard.html">Back to Dashboard</a>
</body>
</html>
