<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <title>Shopping Cart</title>
</head>

<body>
    <h1>Shopping Cart</h1>

    <a href="/mvc-api/product">Back to Catalog</a> | <a href="/dashboard/dashboard.html">Dashboard</a>

    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Quantity</th>
                <th>Price each</th>
                <th>Total Price</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="entry : ${cart.products.entrySet()}">
                <td th:text="${entry.key.name}"></td>
                <td th:text="${entry.value}"></td>
                <td th:text="${entry.key.price} + ' EUR'"></td>
                <td th:text="${entry.key.price * entry.value} + ' EUR'"></td>
            </tr>
        </tbody>
    </table>

    <h3>Total:
        <span th:text="${total}"></span>
        <span th:text="${currencySymbol}"></span>
    </h3>

    <div th:if="${voucherApplied}">
        <p style="color: green;">
            A <span th:text="${discountPercentage}"></span>% voucher has been applied!
        </p>
        <a href="/cart/remove-voucher"><button>Remove Voucher</button></a>
    </div>
    <div th:unless="${voucherApplied}">
        <p>No voucher has been applied yet.</p>
        <a href="/cart/voucher"><button>Apply <span th:text="${discountPercentage}"></span>% Voucher</button></a>
    </div>

    <hr />

    <div>
        <span th:if="${isEur}">
            <a href="/cart/currency?code=USD"><button>Convert to Dollar</button></a>
        </span>
        <span th:unless="${isEur}">
            <a href="/cart/currency?code=EUR"><button>Convert to Euro</button></a>
        </span>
    </div>

</body>

</html>
