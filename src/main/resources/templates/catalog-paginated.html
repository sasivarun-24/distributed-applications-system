<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Catalog (Paginated)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h1>Product Catalog (Page <span th:text="${page.number + 1}"></span>)</h1>

<div class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col" th:each="product : ${products}">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                <p class="card-text">Price: <span th:text="${product.price}">0.00</span> EUR</p>
                <a th:href="@{/mvc-api/product/{id}(id=${product.id})}">View Details</a>
                <br>
                <a th:href="@{/cart-add/{id}(id=${product.id})}" class="btn btn-primary mt-2">Add to Cart</a>
            </div>
        </div>
    </div>
</div>

<div class="mt-4 d-flex justify-content-between">
    <!-- Previous Button -->
    <a th:if="${page.hasPrevious()}"
       th:href="@{/mvc-api/product/catalog-paginated(page=${page.number - 1}, size=${page.size})}"
       class="btn btn-secondary">Previous</a>
    <span th:unless="${page.hasPrevious()}"></span>

    <!-- Next Button -->
    <a th:if="${page.hasNext()}"
       th:href="@{/mvc-api/product/catalog-paginated(page=${page.number + 1}, size=${page.size})}"
       class="btn btn-primary">Next</a>
    <span th:unless="${page.hasNext()}"></span>
</div>

<div class="mt-3">
    <a href="/mvc-api/product" class="btn btn-link">Back to full catalog</a>
</div>

</body>
</html>
